name: Test

on:
  pull_request:
  push:
    branches:
      - codex/conversation-scoped-artifacts
      - feature/structural-optimizations

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
